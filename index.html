<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Ads Scraper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: #fff;
      padding: 24px 32px;
      border-bottom: 1px solid #e0e0e0;
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111;
    }

    header p {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Search Form */
    .search-panel {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #333;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #333;
    }

    .form-group select {
      cursor: pointer;
    }

    .search-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-btn:hover { background: #555; }
    .search-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* Results */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .results-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .results-count {
      font-size: 14px;
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fff5f5;
      border: 1px solid #e0b0b0;
      color: #c00;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    /* Table */
    .table-wrap {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      overflow-x: auto;
    }

    .ads-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .ads-table thead {
      background: #f8f8f8;
      border-bottom: 2px solid #e0e0e0;
    }

    .ads-table th {
      text-align: left;
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .ads-table td {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: top;
      color: #333;
    }

    .ads-table tbody tr:hover {
      background: #fafafa;
    }

    .ads-table .page-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ads-table .page-cell img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }

    .ads-table .page-cell-info {
      line-height: 1.3;
    }

    .ads-table .page-cell-info strong {
      font-size: 13px;
      color: #111;
      display: block;
    }

    .ads-table .page-cell-info span {
      font-size: 11px;
      color: #888;
    }

    .ads-table .body-cell {
      max-width: 320px;
      line-height: 1.4;
      color: #555;
    }

    .ads-table .body-cell .ad-title {
      font-weight: 600;
      color: #222;
      margin-bottom: 2px;
    }

    .ads-table .body-cell .ad-body {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ads-table .thumb-cell img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      background: #f0f0f0;
    }

    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 500;
      display: inline-block;
      margin: 1px 2px;
    }

    .tag-active {
      background: #e6f4ea;
      color: #1e8e3e;
    }

    .tag-inactive {
      background: #fce8e6;
      color: #c5221f;
    }

    .tag-platform {
      background: #e8f0fe;
      color: #1a73e8;
    }

    .ads-table a {
      color: #1a73e8;
      text-decoration: none;
    }

    .ads-table a:hover {
      text-decoration: underline;
    }

    .export-btn {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .export-btn:hover {
      background: #f5f5f5;
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .no-results p {
      font-size: 16px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      width: 460px;
      max-width: 90vw;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .modal h3 {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }

    .modal p {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .modal input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      margin-bottom: 16px;
    }

    .modal input:focus {
      outline: none;
      border-color: #333;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .modal-cancel {
      background: #f0f0f0;
      color: #333;
    }

    .modal-cancel:hover { background: #e5e5e5; }

    .modal-send {
      background: #333;
      color: #fff;
    }

    .modal-send:hover { background: #555; }
    .modal-send:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .clay-progress {
      margin-top: 14px;
      font-size: 13px;
      color: #555;
    }

    .clay-progress .bar {
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .clay-progress .bar-fill {
      height: 100%;
      background: #1e8e3e;
      border-radius: 3px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>

  <header>
    <h1>Meta Ads Scraper</h1>
    <p>Search and explore ads from the Meta Ad Library <a href="#" onclick="event.preventDefault(); localStorage.removeItem('apify_token'); location.reload();" style="color:#888;font-size:12px;margin-left:8px">Change API Token</a></p>
  </header>

  <div class="container">
    <div class="search-panel">
      <div class="form-grid">
        <div class="form-group">
          <label>Search Keyword</label>
          <input type="text" id="query" placeholder="e.g. Tesla, Nike, Coffee (comma separated)" value="Tesla">
        </div>
        <div class="form-group">
          <label>Country</label>
          <select id="country">
            <option value="ALL">All Countries</option>
            <option value="US">United States</option>
            <option value="GB">United Kingdom</option>
            <option value="CA">Canada</option>
            <option value="AU">Australia</option>
            <option value="DE">Germany</option>
            <option value="FR">France</option>
            <option value="IN">India</option>
            <option value="BR">Brazil</option>
            <option value="AT" selected>Austria</option>
            <option value="IT">Italy</option>
            <option value="ES">Spain</option>
            <option value="NL">Netherlands</option>
            <option value="JP">Japan</option>
            <option value="MX">Mexico</option>
            <option value="SE">Sweden</option>
            <option value="CH">Switzerland</option>
            <option value="PL">Poland</option>
            <option value="BE">Belgium</option>
            <option value="PT">Portugal</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ad Type</label>
          <select id="ad_type">
            <option value="ALL">All Types</option>
            <option value="POLITICAL_AND_ISSUE_ADS">Political & Issue Ads</option>
            <option value="HOUSING_ADS">Housing Ads</option>
            <option value="EMPLOYMENT_ADS">Employment Ads</option>
            <option value="CREDIT_ADS">Credit Ads</option>
          </select>
        </div>
        <div class="form-group">
          <label>Media Type</label>
          <select id="media_type">
            <option value="ALL">All Media</option>
            <option value="IMAGE">Image</option>
            <option value="VIDEO">Video</option>
            <option value="MEME">Meme</option>
            <option value="NONE">No Media</option>
          </select>
        </div>
        <div class="form-group">
          <label>Active Status</label>
          <select id="active_status">
            <option value="ALL">All Ads</option>
            <option value="ACTIVE">Active Only</option>
            <option value="INACTIVE">Inactive Only</option>
          </select>
        </div>
        <div class="form-group">
          <label>Sort By</label>
          <select id="sort_by">
            <option value="IMPRESSIONS">Impressions</option>
            <option value="RECENT">Most Recent</option>
          </select>
        </div>
        <div class="form-group">
          <label>Max Ads (optional)</label>
          <input type="number" id="max_ads" placeholder="Leave empty for all" min="1">
        </div>
      </div>
      <button class="search-btn" id="searchBtn" onclick="searchAds()">Search Ads</button>
    </div>

    <div id="results"></div>
  </div>

  <!-- Clay Webhook Modal -->
  <div class="modal-overlay" id="clayModal">
    <div class="modal">
      <h3>Export to Clay</h3>
      <p>Paste your Clay webhook URL below. Rows will be sent one per second.</p>
      <input type="text" id="clayWebhookUrl" placeholder="https://app.clay.com/webhook/...">
      <div class="clay-progress" id="clayProgress" style="display:none">
        <span id="clayStatusText">Sending row 0 of 0...</span>
        <div class="bar"><div class="bar-fill" id="clayBarFill" style="width:0%"></div></div>
      </div>
      <div class="modal-actions">
        <button class="modal-cancel" id="clayCancelBtn" onclick="closeClayModal()">Cancel</button>
        <button class="modal-send" id="claySendBtn" onclick="startClayExport()">Send Data</button>
      </div>
    </div>
  </div>

  <script>
    const APIFY_ACTOR = 'curious_coder~facebook-ads-library-scraper';
    const APIFY_BASE = 'https://api.apify.com/v2';

    function getApifyToken() {
      let token = localStorage.getItem('apify_token');
      if (!token) {
        token = prompt('Enter your Apify API token:');
        if (token) localStorage.setItem('apify_token', token.trim());
      }
      return token ? token.trim() : null;
    }

    const APIFY_TOKEN = getApifyToken();

    // Build a Facebook Ad Library URL from form inputs
    function buildAdLibraryUrl(keyword, filters) {
      const params = new URLSearchParams();
      params.set('active_status', filters.active_status === 'ALL' ? 'all' : filters.active_status.toLowerCase());
      params.set('ad_type', filters.ad_type === 'ALL' ? 'all' : filters.ad_type.toLowerCase());
      params.set('country', filters.country === 'ALL' ? 'ALL' : filters.country);
      params.set('q', keyword);
      params.set('search_type', 'keyword_unordered');
      params.set('media_type', filters.media_type === 'ALL' ? 'all' : filters.media_type.toLowerCase());
      return `https://www.facebook.com/ads/library/?${params.toString()}`;
    }

    // Build the Apify actor input payload
    function buildApifyInput(keywords, filters, maxAds) {
      const SORT_MAP = { IMPRESSIONS: 'impressions_desc', RECENT: 'most_recent' };
      const ACTIVE_MAP = { ALL: 'all', ACTIVE: 'active', INACTIVE: 'inactive' };

      const urls = keywords.map(kw => ({ url: buildAdLibraryUrl(kw, filters) }));

      return {
        urls,
        count: Math.max(maxAds || 5000, 10),
        'scrapePageAds.activeStatus': ACTIVE_MAP[filters.active_status] || 'all',
        'scrapePageAds.sortBy': SORT_MAP[filters.sort_by] || 'impressions_desc',
        'scrapePageAds.countryCode': filters.country === 'ALL' ? 'ALL' : filters.country,
      };
    }

    // Retry wrapper for fetch calls
    async function fetchWithRetry(url, options = {}, maxRetries = 3) {
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const res = await fetch(url, options);
          if (res.status >= 500 && attempt < maxRetries) {
            await new Promise(r => setTimeout(r, 1000 * attempt));
            continue;
          }
          return res;
        } catch (err) {
          if (attempt === maxRetries) throw err;
          await new Promise(r => setTimeout(r, 1000 * attempt));
        }
      }
    }

    // Start an Apify actor run
    async function startApifyRun(input) {
      const url = `${APIFY_BASE}/acts/${APIFY_ACTOR}/runs?token=${APIFY_TOKEN}`;
      const res = await fetchWithRetry(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(input),
      });
      if (!res.ok) {
        const detail = await res.text().catch(() => '');
        throw new Error(`Failed to start scraper: ${res.status} ${detail}`);
      }
      return await res.json();
    }

    // Poll an Apify run until it finishes
    async function pollApifyRun(runId, onStatus) {
      const TERMINAL = new Set(['SUCCEEDED', 'FAILED', 'ABORTED', 'TIMED-OUT']);
      const POLL_INTERVAL = 3000;

      while (true) {
        const res = await fetchWithRetry(`${APIFY_BASE}/actor-runs/${runId}?token=${APIFY_TOKEN}`);
        if (!res.ok) throw new Error(`Failed to check run status: ${res.status}`);
        const { data } = await res.json();

        if (onStatus) onStatus(data.status, data.stats);

        if (TERMINAL.has(data.status)) {
          if (data.status !== 'SUCCEEDED') {
            throw new Error(`Scraper run ${data.status.toLowerCase()}. Run ID: ${runId}`);
          }
          return data;
        }

        await new Promise(r => setTimeout(r, POLL_INTERVAL));
      }
    }

    // Fetch all items from an Apify dataset
    async function fetchDatasetItems(datasetId) {
      const res = await fetchWithRetry(`${APIFY_BASE}/datasets/${datasetId}/items?token=${APIFY_TOKEN}&format=json`);
      if (!res.ok) throw new Error(`Failed to fetch results: ${res.status}`);
      return await res.json();
    }

    // Normalize Apify output to match our rendering expectations
    function normalizeAds(items, keywords) {
      // Filter out only error items (keep everything else)
      const errorItems = items.filter(item => item.error);
      const validItems = items.filter(item => !item.error);
      if (errorItems.length) console.warn(`Filtered out ${errorItems.length} error items:`, errorItems);
      console.log(`Processing ${validItems.length} of ${items.length} total items`);
      return validItems.map(item => {
        // Try to determine which keyword this ad came from
        let keyword = '';
        if (item.searchQuery) {
          keyword = item.searchQuery;
        } else if (item.url || item.sourceUrl) {
          try {
            const u = new URL(item.url || item.sourceUrl);
            keyword = u.searchParams.get('q') || '';
          } catch (_) {}
        }
        if (!keyword && keywords.length === 1) {
          keyword = keywords[0];
        }
        item._keyword = keyword || keywords.join(', ');

        // Normalize is_active to boolean
        if (typeof item.is_active === 'string') {
          item.is_active = item.is_active === 'ACTIVE' || item.is_active === 'true';
        }

        // Ensure publisher_platform is an array
        if (item.publisher_platform && !Array.isArray(item.publisher_platform)) {
          item.publisher_platform = [item.publisher_platform];
        }

        // Ensure snapshot exists
        if (!item.snapshot) item.snapshot = {};

        return item;
      });
    }

    async function searchAds() {
      const raw = document.getElementById('query').value.trim();
      if (!raw) {
        showError('Please enter a search keyword.');
        return;
      }

      const keywords = raw.split(',').map(k => k.trim()).filter(Boolean);
      if (!keywords.length) {
        showError('Please enter at least one keyword.');
        return;
      }

      const filters = {
        country: document.getElementById('country').value,
        ad_type: document.getElementById('ad_type').value,
        media_type: document.getElementById('media_type').value,
        active_status: document.getElementById('active_status').value,
        sort_by: document.getElementById('sort_by').value,
      };

      const maxAdsInput = document.getElementById('max_ads').value;
      const maxAds = maxAdsInput ? parseInt(maxAdsInput, 10) : 0;

      const btn = document.getElementById('searchBtn');
      const resultsDiv = document.getElementById('results');
      btn.disabled = true;
      btn.textContent = 'Searching...';

      try {
        // Step 1: Build input and start the Apify actor
        const input = buildApifyInput(keywords, filters, maxAds);
        resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div><p>Starting scraper for ${keywords.length} keyword${keywords.length > 1 ? 's' : ''}...</p></div>`;

        const runResponse = await startApifyRun(input);
        const runId = runResponse.data.id;
        const datasetId = runResponse.data.defaultDatasetId;

        // Step 2: Poll for completion
        const startTime = Date.now();
        await pollApifyRun(runId, (status) => {
          const elapsed = Math.round((Date.now() - startTime) / 1000);
          const mins = Math.floor(elapsed / 60);
          const secs = elapsed % 60;
          const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
          resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div><p>Scraper running... Status: ${status} (${timeStr} elapsed)</p></div>`;
        });

        // Step 3: Fetch results
        resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div><p>Fetching results...</p></div>`;
        const items = await fetchDatasetItems(datasetId);

        // Step 4: Normalize and render
        const allAds = normalizeAds(items, keywords);
        // Log first item to console for debugging field mappings
        if (allAds.length) console.log('First ad item:', allAds[0]);
        renderResults(allAds, allAds.length, keywords.join(', '));

      } catch (err) {
        showError(`Failed to fetch ads: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Search Ads';
      }
    }

    function showError(msg) {
      document.getElementById('results').innerHTML = `<div class="error-msg">${escapeHtml(msg)}</div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(dateValue) {
      if (!dateValue) return 'N/A';
      let d;
      if (typeof dateValue === 'number') {
        // Handle both seconds and milliseconds timestamps
        d = dateValue > 1e12 ? new Date(dateValue) : new Date(dateValue * 1000);
      } else {
        d = new Date(dateValue);
      }
      if (isNaN(d.getTime())) return 'N/A';
      return d.toLocaleDateString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric'
      });
    }

    let lastAdsData = [];
    let lastGroupedData = [];

    function renderResults(allAds, totalCount, query) {
      const resultsDiv = document.getElementById('results');
      lastAdsData = allAds;

      if (!allAds.length) {
        resultsDiv.innerHTML = '<div class="no-results"><p>No ads found. Try a different keyword or filters.</p></div>';
        return;
      }

      // Group by advertiser (page_id or page_name)
      const advertiserMap = new Map();
      for (const ad of allAds) {
        const snap = ad.snapshot || {};
        const key = ad.page_id || snap.page_name || ad.page_name || 'Unknown';
        if (!advertiserMap.has(key)) {
          advertiserMap.set(key, { representative: ad, ads: [] });
        }
        advertiserMap.get(key).ads.push(ad);
      }

      lastGroupedData = Array.from(advertiserMap.values());

      let html = `
        <div class="results-header">
          <h2>Results for "${escapeHtml(query)}"</h2>
          <div>
            <button class="export-btn" onclick="exportCSV()">Export CSV</button>
            <button class="export-btn" style="margin-left:8px" onclick="openClayModal()">Export to Clay</button>
            <span class="results-count" style="margin-left:12px">${allAds.length} ads from ${lastGroupedData.length} advertisers (${totalCount.toLocaleString()} total in library)</span>
          </div>
        </div>
        <div class="table-wrap">
        <table class="ads-table">
          <thead>
            <tr>
              <th></th>
              <th>Keyword</th>
              <th>Page</th>
              <th>Ad Content</th>
              <th># Ads</th>
              <th>Status</th>
              <th>Platforms</th>
              <th>CTA</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (const group of lastGroupedData) {
        html += renderAdRow(group.representative, group.ads.length);
      }

      html += '</tbody></table></div>';
      resultsDiv.innerHTML = html;
    }

    function renderAdRow(ad, adCount) {
      const snap = ad.snapshot || {};
      const images = snap.images || [];
      const title = snap.title || '';
      const bodyText = snap.body?.text || '';
      const pageName = snap.page_name || ad.page_name || 'Unknown Page';
      const pageImg = snap.page_profile_picture_url || '';
      const pageCategories = snap.page_categories || [];
      const platforms = (ad.publisher_platform || []).map(p => p.toLowerCase().replace('_', ' '));
      const isActive = ad.is_active;
      const ctaText = snap.cta_text || '';
      const linkUrl = snap.link_url || '';
      const pageUri = snap.page_profile_uri || '';

      // Fallback to cards for carousel/video ads where images[] is empty
      const cards = snap.cards || [];
      let thumbUrl = images.length ? (images[0].resized_image_url || images[0].original_image_url) : '';
      if (!thumbUrl && cards.length) {
        thumbUrl = cards[0].resized_image_url || cards[0].original_image_url || '';
      }

      // Prefer ad_library_url (direct ad link) over page_profile_uri
      const adLink = ad.ad_library_url || pageUri;

      return `
        <tr>
          <td class="thumb-cell">
            ${thumbUrl ? `<img src="${thumbUrl}" alt="" onerror="this.style.display='none'">` : ''}
          </td>
          <td style="white-space:nowrap">${escapeHtml(ad._keyword || '')}</td>
          <td>
            <div class="page-cell">
              ${pageImg ? `<img src="${pageImg}" alt="">` : ''}
              <div class="page-cell-info">
                <strong>${escapeHtml(pageName)}</strong>
                <span>${pageCategories.map(c => escapeHtml(c)).join(', ') || ''}</span>
              </div>
            </div>
          </td>
          <td class="body-cell">
            ${title ? `<div class="ad-title">${escapeHtml(title)}</div>` : ''}
            <div class="ad-body">${escapeHtml(bodyText)}</div>
          </td>
          <td style="text-align:center;font-weight:600">${adCount}</td>
          <td><span class="tag ${isActive ? 'tag-active' : 'tag-inactive'}">${isActive ? 'Active' : 'Inactive'}</span></td>
          <td>${platforms.map(p => `<span class="tag tag-platform">${p}</span>`).join(' ')}</td>
          <td>${ctaText ? escapeHtml(ctaText) : ''}</td>
          <td style="white-space:nowrap">${formatDate(ad.start_date)}</td>
          <td style="white-space:nowrap">${formatDate(ad.end_date)}</td>
          <td>${adLink ? `<a href="${adLink}" target="_blank" rel="noopener">View</a>` : ''}</td>
        </tr>
      `;
    }

    function exportCSV() {
      if (!lastGroupedData.length) return;

      const headers = ['Keyword', 'Page Name', 'Category', '# Ads', 'Title', 'Body Text', 'Status', 'Platforms', 'CTA', 'Link URL', 'Start Date', 'End Date', 'Ad Library URL', 'Page URL'];
      const rows = lastGroupedData.map(group => {
        const ad = group.representative;
        const snap = ad.snapshot || {};
        return [
          ad._keyword || '',
          snap.page_name || ad.page_name || '',
          (snap.page_categories || []).join('; '),
          group.ads.length,
          snap.title || '',
          (snap.body?.text || '').replace(/\n/g, ' '),
          ad.is_active ? 'Active' : 'Inactive',
          (ad.publisher_platform || []).join('; '),
          snap.cta_text || '',
          snap.link_url || '',
          formatDate(ad.start_date),
          formatDate(ad.end_date),
          ad.ad_library_url || '',
          snap.page_profile_uri || ''
        ];
      });

      const csvContent = [headers, ...rows]
        .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'meta_ads_export.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Clay webhook export
    let clayAbort = false;

    function openClayModal() {
      if (!lastAdsData.length) return;
      clayAbort = false;
      document.getElementById('clayWebhookUrl').value = '';
      document.getElementById('clayProgress').style.display = 'none';
      document.getElementById('claySendBtn').disabled = false;
      document.getElementById('claySendBtn').textContent = 'Send Data';
      document.getElementById('clayModal').classList.add('active');
    }

    function closeClayModal() {
      clayAbort = true;
      document.getElementById('clayModal').classList.remove('active');
    }

    async function startClayExport() {
      const webhookUrl = document.getElementById('clayWebhookUrl').value.trim();
      if (!webhookUrl) {
        document.getElementById('clayWebhookUrl').style.borderColor = '#c5221f';
        return;
      }
      document.getElementById('clayWebhookUrl').style.borderColor = '#ddd';

      const sendBtn = document.getElementById('claySendBtn');
      const cancelBtn = document.getElementById('clayCancelBtn');
      const progress = document.getElementById('clayProgress');
      const statusText = document.getElementById('clayStatusText');
      const barFill = document.getElementById('clayBarFill');

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      progress.style.display = 'block';
      clayAbort = false;

      const total = lastGroupedData.length;
      let sent = 0;
      let failed = 0;

      for (let i = 0; i < total; i++) {
        if (clayAbort) break;

        const group = lastGroupedData[i];
        const ad = group.representative;
        const snap = ad.snapshot || {};
        const payload = {
          keyword: ad._keyword || '',
          page_name: snap.page_name || ad.page_name || '',
          category: (snap.page_categories || []).join('; '),
          num_ads: group.ads.length,
          title: snap.title || '',
          body_text: snap.body?.text || '',
          status: ad.is_active ? 'Active' : 'Inactive',
          platforms: (ad.publisher_platform || []).join('; '),
          cta: snap.cta_text || '',
          link_url: snap.link_url || '',
          start_date: formatDate(ad.start_date),
          end_date: formatDate(ad.end_date),
          ad_library_url: ad.ad_library_url || '',
          page_url: snap.page_profile_uri || '',
          image_url: (snap.images && snap.images.length) ? (snap.images[0].original_image_url || '') : ((snap.cards && snap.cards.length) ? (snap.cards[0].original_image_url || '') : '')
        };

        try {
          await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            mode: 'no-cors'
          });
          sent++;
        } catch (e) {
          failed++;
        }

        const done = i + 1;
        const pct = Math.round((done / total) * 100);
        statusText.textContent = `Sent ${done} of ${total}${failed ? ` (${failed} failed)` : ''}`;
        barFill.style.width = pct + '%';

        // Wait 1 second before next row (skip wait on last row)
        if (i < total - 1 && !clayAbort) {
          await new Promise(r => setTimeout(r, 1000));
        }
      }

      if (!clayAbort) {
        sendBtn.textContent = 'Done!';
        statusText.textContent = `Completed: ${sent} sent${failed ? `, ${failed} failed` : ''} of ${total}`;
        barFill.style.width = '100%';
        cancelBtn.textContent = 'Close';
      }
    }

    // Allow Enter key to trigger search
    document.getElementById('query').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchAds();
    });
  </script>
</body>
